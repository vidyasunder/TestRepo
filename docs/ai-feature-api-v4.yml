openapi: 3.0.0
info:
  title: AI Feature API.
  description: |
    Serves Nearmap AI Features.
  version: "4.0.0"
  contact:
    email: apiteam@nearmap.com

servers:
  - description: Production
    url: https://api.nearmap.com/ai/features/v4

security:
  - APIKeyQuery: []
  - APIKeyHeader: []
  - TXV3TokenHeader: []

tags:
  - name: features
  - name: rollups

paths:
  /features.json:
    get:
      tags:
        - features
      summary: Returns AI features with their attributes.
      description: |
        Returns features, their attributes and optional supplementary data
        within the given polygon or address, and date range.
      operationId: getFeaturesByDate
      parameters:
        - $ref: "#/components/parameters/optionalPolygon"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/bulk"
        - $ref: "#/components/parameters/packs"
        - $ref: "#/components/parameters/classes"
        - $ref: "#/components/parameters/streetAddress"
        - $ref: "#/components/parameters/city"
        - $ref: "#/components/parameters/state"
        - $ref: "#/components/parameters/zip"
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/reference"
        - $ref: "#/components/parameters/systemVersion"
        - $ref: "#/components/parameters/systemVersionPrefix"
        - $ref: "#/components/parameters/alpha"
        - $ref: "#/components/parameters/beta"
        - $ref: "#/components/parameters/3dCoverageFeature"
        - $ref: "#/components/parameters/parcelMode"
        - $ref: "#/components/parameters/rapid"
        - $ref: "#/components/parameters/includeSuppData"
        - $ref: "#/components/parameters/excludePartialResources"
        - $ref: "#/components/parameters/postcat"
        - $ref: "#/components/parameters/damageModelVersion"
      responses:
        "200":
          $ref: "#/components/responses/features_ok"
        "400":
          $ref: "#/components/responses/features_bad_request"
        "401":
          $ref: "#/components/responses/generic_unauthorized"
        "403":
          $ref: "#/components/responses/generic_forbidden"
        "404":
          $ref: "#/components/responses/features_not_found"

    post:
      tags:
        - features
      summary: Returns AI features with their attributes.
      description: |
        Returns features, their attributes and optional supplementary data
        within the given AOI or address, and date range.

        Operates semantically the same way as the GET variant but allows the AOI and classes
        to be passed inside the request body rather than as a polygon query
        parameter. This may be required for AOIs and classes whose representations are
        large, in order to avoid URL length limitations.
      operationId: postFeaturesByDate
      parameters:
        - $ref: "#/components/parameters/optionalPolygon"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/until"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/bulk"
        - $ref: "#/components/parameters/packs"
        - $ref: "#/components/parameters/classes"
        - $ref: "#/components/parameters/streetAddress"
        - $ref: "#/components/parameters/city"
        - $ref: "#/components/parameters/state"
        - $ref: "#/components/parameters/zip"
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/reference"
        - $ref: "#/components/parameters/systemVersion"
        - $ref: "#/components/parameters/systemVersionPrefix"
        - $ref: "#/components/parameters/alpha"
        - $ref: "#/components/parameters/beta"
        - $ref: "#/components/parameters/3dCoverageFeature"
        - $ref: "#/components/parameters/parcelMode"
        - $ref: "#/components/parameters/rapid"
        - $ref: "#/components/parameters/includeSuppData"
        - $ref: "#/components/parameters/excludePartialResources"
        - $ref: "#/components/parameters/postcat"
        - $ref: "#/components/parameters/damageModelVersion"
      requestBody:
        $ref: "#/components/requestBodies/aoi_and_classes"
      responses:
        "200":
          $ref: "#/components/responses/features_ok"
        "400":
          $ref: "#/components/responses/features_bad_request"
        "401":
          $ref: "#/components/responses/generic_unauthorized"
        "403":
          $ref: "#/components/responses/generic_forbidden"
        "404":
          $ref: "#/components/responses/features_not_found"

  /surveyresources/{surveyResourceId}/features.json:
    get:
      tags:
        - features
      summary: Returns AI features with their attributes.
      description: |
        Returns features, their attributes and optional supplementary data
